<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligent Study Planner</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet"><style>:root{--ink:#172033;--brand:#6366f1;--soft:#f5f7fb}body{background:var(--soft);color:var(--ink)}.sidebar{min-height:100vh;background:#111827}.sidebar a{color:#dbeafe;display:block;padding:10px 14px;border-radius:10px;text-decoration:none;margin:3px 0}.sidebar a:hover,.sidebar a.active{background:#26324a}.brand{color:white;font-weight:800}.card{border:0;box-shadow:0 6px 22px rgba(20,30,55,.06)}.stat{font-size:1.6rem;font-weight:800}.page{display:none}.page.active{display:block}.badge-soft{background:#eef2ff;color:#4338ca}.progress{height:9px}.table td,.table th{vertical-align:middle}.login{max-width:430px;margin:8vh auto}.small-muted{color:#6b7280;font-size:.9rem}</style></head><body><div id="loginView" class="container"><div class="login card p-4"><h2>📚 Intelligent Study Planner</h2><p class="small-muted">Free/open-source college mini-project</p><div id="authMsg"></div><div class="mb-2"><input id="email" class="form-control" placeholder="Email"></div><div class="mb-3"><input id="password" type="password" class="form-control" placeholder="Password"></div><button class="btn btn-primary w-100" onclick="login()">Login</button><hr><h6>New student?</h6><input id="regName" class="form-control mb-2" placeholder="Full name"><input id="regEmail" class="form-control mb-2" placeholder="Email"><input id="regPassword" type="password" class="form-control mb-2" placeholder="Password (6+ characters)"><input id="regConfirm" type="password" class="form-control mb-2" placeholder="Confirm password"><button class="btn btn-outline-primary w-100" onclick="register()">Create account</button></div></div><div id="appView" class="d-none"><div class="container-fluid"><div class="row"><aside class="col-lg-2 p-3 sidebar"><div class="brand fs-5 mb-3">📚 Study Planner</div><div id="nav"></div><button class="btn btn-sm btn-outline-light w-100 mt-3" onclick="logout()">Logout</button></aside><main class="col-lg-10 p-3 p-lg-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h3 id="pageTitle">Dashboard</h3><span id="welcome" class="small-muted"></span></div><button class="btn btn-primary" onclick="generatePlan()">⚡ Generate / Refresh Plan</button></div><div id="toast"></div><section id="dashboard" class="page active"></section><section id="subjects" class="page"></section><section id="topics" class="page"></section><section id="assignments" class="page"></section><section id="exams" class="page"></section><section id="availability" class="page"></section><section id="planner" class="page"></section><section id="calendar" class="page"></section><section id="progress" class="page"></section><section id="ai" class="page"></section><section id="reports" class="page"></section><section id="profile" class="page"></section></main></div></div></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script><script src="js/app.js"></script></body></html>
