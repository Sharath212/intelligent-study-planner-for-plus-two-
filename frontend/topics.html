<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topics - StudyPlanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">?? StudyPlanner</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="subjects.html" class="btn btn-outline-light btn-sm">Subjects</a>
            <a href="topics.html" class="btn btn-outline-light btn-sm">Topics</a>
            <a href="planner.html" class="btn btn-outline-light btn-sm">Planner</a>
            <a href="profile.html" class="btn btn-outline-light btn-sm">Profile</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">

<div class="page-header">
<h2>?? Topics</h2>
<p class="text-muted">Add topics and mark them complete as you study.</p>
</div>

<div id="message"></div>

<div class="content-card mb-4">
<h4>Add Topic</h4>

<form id="topicForm" class="row g-3">

<div class="col-md-4">
<label class="form-label">Topic</label>
<input id="topicName" class="form-control" required>
</div>

<div class="col-md-3">
<label class="form-label">Subject</label>
<select id="topicSubject" class="form-select" required></select>
</div>

<div class="col-md-2">
<label class="form-label">Difficulty</label>
<select id="topicDifficulty" class="form-select">
<option>Easy</option>
<option selected>Medium</option>
<option>Hard</option>
</select>
</div>

<div class="col-md-2">
<label class="form-label">Hours</label>
<input id="topicHours" type="number" min="0.5" step="0.5" value="1" class="form-control">
</div>

<div class="col-md-1 d-flex align-items-end">
<button class="btn btn-primary w-100">Add</button>
</div>

</form>
</div>

<div class="content-card">
<h4>Topic List</h4>
<div id="topicsList" class="mt-3"></div>
</div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/topics.js"></script>

</body>
</html>
