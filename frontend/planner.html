<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Planner - StudyPlanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">?? StudyPlanner</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="subjects.html" class="btn btn-outline-light btn-sm">Subjects</a>
            <a href="topics.html" class="btn btn-outline-light btn-sm">Topics</a>
            <a href="planner.html" class="btn btn-outline-light btn-sm">Planner</a>
            <a href="profile.html" class="btn btn-outline-light btn-sm">Profile</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">

<div class="page-header">
<h2>?? Intelligent Study Planner</h2>
<p class="text-muted">
Generate a personalized study schedule.
</p>
</div>

<div id="message"></div>

<div class="content-card mb-4">

<h4>Generate Plan</h4>

<form id="plannerForm" class="row g-3">

<div class="col-md-4">
<label class="form-label">Plan Start Date</label>
<input id="planStart" type="date" class="form-control" required>
</div>

<div class="col-md-4">
<label class="form-label">Daily Study Hours</label>
<input id="dailyHours" type="number" min="1" max="16"
       value="3" step=".5" class="form-control">
</div>

<div class="col-md-4 d-flex align-items-end">
<button class="btn btn-success w-100">
Generate Study Plan
</button>
</div>

</form>

</div>

<div class="content-card">

<h4>Your Study Schedule</h4>

<div id="plannerList" class="mt-3"></div>

</div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/planner.js"></script>

</body>
</html>
