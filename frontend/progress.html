<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress - StudyPlanner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">?? StudyPlanner</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="subjects.html" class="btn btn-outline-light btn-sm">Subjects</a>
            <a href="topics.html" class="btn btn-outline-light btn-sm">Topics</a>
            <a href="planner.html" class="btn btn-outline-light btn-sm">Planner</a>
            <a href="profile.html" class="btn btn-outline-light btn-sm">Profile</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">

<div class="page-header">
<h2>?? Progress Tracking</h2>
<p class="text-muted">
See how much of your study plan you have completed.
</p>
</div>

<div class="row g-4 mb-4">

<div class="col-md-4">
<div class="stat-card">
<div class="text-muted">Overall Progress</div>
<div id="overallProgress" class="stat-number">0%</div>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<div class="text-muted">Completed Topics</div>
<div id="completedTopics" class="stat-number">0</div>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<div class="text-muted">Pending Topics</div>
<div id="pendingTopics" class="stat-number">0</div>
</div>
</div>

</div>

<div class="content-card">
<h4>Subject Progress</h4>
<div id="subjectProgress" class="mt-4"></div>
</div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/progress.js"></script>

</body>
</html>
