<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subjects - StudyPlanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">?? StudyPlanner</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="subjects.html" class="btn btn-outline-light btn-sm">Subjects</a>
            <a href="topics.html" class="btn btn-outline-light btn-sm">Topics</a>
            <a href="planner.html" class="btn btn-outline-light btn-sm">Planner</a>
            <a href="profile.html" class="btn btn-outline-light btn-sm">Profile</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">

<div class="page-header">
<h2>?? Subjects</h2>
<p class="text-muted">Manage your subjects and study priorities.</p>
</div>

<div id="message"></div>

<div class="content-card mb-4">
<h4>Add Subject</h4>

<form id="subjectForm" class="row g-3 mt-1">

<div class="col-md-5">
<label class="form-label">Subject Name</label>
<input id="subjectName" class="form-control" required>
</div>

<div class="col-md-3">
<label class="form-label">Difficulty</label>
<select id="subjectDifficulty" class="form-select">
<option value="Easy">Easy</option>
<option value="Medium" selected>Medium</option>
<option value="Hard">Hard</option>
</select>
</div>

<div class="col-md-2">
<label class="form-label">Target Hours</label>
<input id="targetHours" type="number" min="0" class="form-control" value="10">
</div>

<div class="col-md-2 d-flex align-items-end">
<button class="btn btn-primary w-100">Add Subject</button>
</div>

</form>
</div>

<div class="content-card">
<h4>Your Subjects</h4>
<div id="subjectsList" class="row g-3 mt-1"></div>
</div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/subjects.js"></script>
</body>
</html>
