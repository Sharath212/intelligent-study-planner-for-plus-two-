<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Availability - StudyPlanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">?? StudyPlanner</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="subjects.html" class="btn btn-outline-light btn-sm">Subjects</a>
            <a href="topics.html" class="btn btn-outline-light btn-sm">Topics</a>
            <a href="planner.html" class="btn btn-outline-light btn-sm">Planner</a>
            <a href="profile.html" class="btn btn-outline-light btn-sm">Profile</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">

<div class="page-header">
<h2>? Study Availability</h2>
<p class="text-muted">Tell the planner when you are available to study.</p>
</div>

<div id="message"></div>

<div class="content-card">

<form id="availabilityForm">

<div class="row g-3">

<div class="col-md-4">
<label class="form-label">Day</label>
<select id="day" class="form-select">
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
<option>Sunday</option>
</select>
</div>

<div class="col-md-3">
<label class="form-label">Start Time</label>
<input id="startTime" type="time" class="form-control" value="17:00">
</div>

<div class="col-md-3">
<label class="form-label">End Time</label>
<input id="endTime" type="time" class="form-control" value="20:00">
</div>

<div class="col-md-2 d-flex align-items-end">
<button class="btn btn-primary w-100">Save</button>
</div>

</div>

</form>

<hr class="my-4">

<h4>Saved Availability</h4>

<div id="availabilityList"></div>

</div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/availability.js"></script>

</body>
</html>
