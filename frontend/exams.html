<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exams - StudyPlanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">?? StudyPlanner</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="subjects.html" class="btn btn-outline-light btn-sm">Subjects</a>
            <a href="topics.html" class="btn btn-outline-light btn-sm">Topics</a>
            <a href="planner.html" class="btn btn-outline-light btn-sm">Planner</a>
            <a href="profile.html" class="btn btn-outline-light btn-sm">Profile</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">

<div class="page-header">
<h2>?? Exams</h2>
<p class="text-muted">Keep track of your upcoming examinations.</p>
</div>

<div id="message"></div>

<div class="content-card mb-4">
<h4>Add Exam</h4>

<form id="examForm" class="row g-3">

<div class="col-md-4">
<label class="form-label">Exam Name</label>
<input id="examName" class="form-control" required>
</div>

<div class="col-md-3">
<label class="form-label">Subject</label>
<select id="examSubject" class="form-select" required></select>
</div>

<div class="col-md-3">
<label class="form-label">Exam Date</label>
<input id="examDate" type="date" class="form-control" required>
</div>

<div class="col-md-2 d-flex align-items-end">
<button class="btn btn-primary w-100">Add Exam</button>
</div>

</form>
</div>

<div class="content-card">
<h4>Upcoming Exams</h4>

<div class="table-container">
<table class="table align-middle mt-3">
<thead>
<tr>
<th>Exam</th>
<th>Subject</th>
<th>Date</th>
<th>Days Left</th>
<th></th>
</tr>
</thead>
<tbody id="examList"></tbody>
</table>
</div>

</div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/exams.js"></script>

</body>
</html>
